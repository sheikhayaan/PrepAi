name: PrepAI CI / CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build Verification & Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    strategy:
      matrix:
        node-version: [20.x]
        mongodb-version: ['7.0']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Start MongoDB for Integration Testing
        uses: supercharge/mongodb-github-action@1.10.0
        with:
          mongodb-version: ${{ matrix.mongodb-version }}

      - name: Install Backend Dependencies
        run: |
          cd server
          npm ci

      - name: Install Frontend Dependencies
        run: |
          cd client
          npm ci

      - name: Verify Frontend Production Build
        run: |
          cd client
          npm run build

      - name: Validate Server Configuration
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_super_secret_jwt_key_2026_production_ready_32chars
        run: |
          cd server
          node src/config/env.js

      - name: Run Deterministic Unit Checks (No DB / No Redis)
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_super_secret_jwt_key_2026_production_ready_32chars
        run: |
          cd server
          node test-learning-loops.js
          node test_addendum.js
          node test-email.js

      - name: Run Schema & Security Verification Against MongoDB
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/prepai_ci
          JWT_SECRET: ci_test_super_secret_jwt_key_2026_production_ready_32chars
        run: |
          cd server
          node test-verification.js

      - name: Boot Server (degraded mode: no Redis, simulated LLM)
        env:
          NODE_ENV: test
          PORT: 5000
          MONGO_URI: mongodb://localhost:27017/prepai_ci
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_test_super_secret_jwt_key_2026_production_ready_32chars
          LEARNING_LOOPS_ENABLED: 'false'
        run: |
          cd server
          nohup node server.js > /tmp/prepai-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:5000/health/ready > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to become ready"
          curl -sS http://localhost:5000/health/ready || true
          tail -100 /tmp/prepai-server.log
          exit 1

      - name: Run End-to-End Interview & SSE Tests
        env:
          NODE_ENV: test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_test_super_secret_jwt_key_2026_production_ready_32chars
        run: |
          cd server
          node test-e2e.js

      - name: Security Audit (non-blocking dependency report)
        run: |
          cd server
          npm audit --omit=dev --audit-level=high || true

      - name: Dump Server Logs on Failure
        if: failure()
        run: tail -200 /tmp/prepai-server.log || true
