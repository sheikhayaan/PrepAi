name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build Verification & Unit Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Server Dependencies
        run: |
          cd server
          npm install

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Verify Client Production Build
        run: |
          cd client
          npm run build

      - name: Run Unit & Learning Loop Tests
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_super_secret_jwt_key_2026_production_ready_32chars
        run: |
          cd server
          node test-learning-loops.js
          node test_addendum.js
          node test-email.js
