<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img">
<defs>
  <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
  <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
  <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <radialGradient id="halo" cx="50%" cy="0%" r="70%"><stop offset="0" stop-color="#a855f7" stop-opacity="0.42"/><stop offset="0.5" stop-color="#3b82f6" stop-opacity="0.12"/><stop offset="1" stop-color="#05070d" stop-opacity="0"/></radialGradient>
