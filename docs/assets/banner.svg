<circle cx="176" cy="172" r="92" fill="none" stroke="#22d3ee" stroke-opacity="0.28" stroke-width="1.5" filter="url(#softglow)"/><ellipse cx="176" cy="172" rx="118" ry="44" fill="none" stroke="#a855f7" stroke-opacity="0.45" stroke-width="1.5" transform="rotate(-18 176 172)"/><ellipse cx="176" cy="172" rx="118" ry="44" fill="none" stroke="#22d3ee" stroke-opacity="0.30" stroke-width="1" transform="rotate(52 176 172)"/><circle cx="176" cy="172" r="60" fill="url(#g1)" opacity="0.12"/><circle cx="272" cy="140" r="5" fill="#22d3ee" filter="url(#glow)"/><circle cx="92" cy="214" r="4" fill="#a855f7" filter="url(#glow)"/>
<text x="176" y="191" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="64" fill="#e8eefc" font-weight="800" text-anchor="middle" opacity="1.0" letter-spacing="0">P</text>
<text x="332" y="138" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="68" fill="url(#g1)" font-weight="800" text-anchor="start" opacity="1.0" letter-spacing="-1">PrepAI</text>
<text x="334" y="178" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="19" fill="#8b9bb4" font-weight="400" text-anchor="start" opacity="1.0" letter-spacing="0">AI mock interviews that end in a hiring verdict, not a vibe check.</text>
<text x="334" y="216" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#e8eefc" font-weight="500" text-anchor="start" opacity="0.9" letter-spacing="0">Multi-turn SSE streaming · 8 calibrated tracks · async scoring · 1,000-user controls.</text>
<text x="334" y="240" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#8b9bb4" font-weight="400" text-anchor="start" opacity="1.0" letter-spacing="0">MongoDB is the source of truth. Redis is acceleration. Claude is replaceable.</text>
<text x="334" y="264" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#8b9bb4" font-weight="400" text-anchor="start" opacity="1.0" letter-spacing="0">Learning loops A–D can propose, but only a human can promote.</text>
<rect x="332" y="286" width="83" height="28" rx="14" fill="#22d3ee" opacity="0.10" stroke="#22d3ee" stroke-opacity="0.55"/><text x="373.4" y="305" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#22d3ee" font-weight="600" text-anchor="middle" opacity="1.0" letter-spacing="0">React 18</text><rect x="424.8" y="286" width="90" height="28" rx="14" fill="#10b981" opacity="0.10" stroke="#10b981" stroke-opacity="0.55"/><text x="469.75" y="305" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#10b981" font-weight="600" text-anchor="middle" opacity="1.0" letter-spacing="0">Express 4</text><rect x="524.7" y="286" width="90" height="28" rx="14" fill="#f59e0b" opacity="0.10" stroke="#f59e0b" stroke-opacity="0.55"/><text x="569.6500000000001" y="305" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#f59e0b" font-weight="600" text-anchor="middle" opacity="1.0" letter-spacing="0">MongoDB 8</text><rect x="624.6" y="286" width="76" height="28" rx="14" fill="#f43f5e" opacity="0.10" stroke="#f43f5e" stroke-opacity="0.55"/><text x="662.45" y="305" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#f43f5e" font-weight="600" text-anchor="middle" opacity="1.0" letter-spacing="0">Redis 8</text><rect x="710.3" y="286" width="97" height="28" rx="14" fill="#a855f7" opacity="0.10" stroke="#a855f7" stroke-opacity="0.55"/><text x="758.8" y="305" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#a855f7" font-weight="600" text-anchor="middle" opacity="1.0" letter-spacing="0">Claude 3.5</text>
<text x="1120" y="340" font-family="Cascadia Code, Consolas, monospace" font-size="10.5" fill="#5b6b82" font-weight="500" text-anchor="end" opacity="1.0" letter-spacing="0">measured, not marketed</text>

