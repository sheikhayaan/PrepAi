# Single-host reference stack: web + api + mongo + redis.
# For production, point MONGO_URI/REDIS_URL at managed services and run the
# api image behind a load balancer with SSE buffering disabled.
name: prepai

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/prepai
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the environment or .env file}
      CLIENT_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # Leave empty for deterministic simulation; set to enable Claude.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-PrepAI <no-reply@prepai.local>}
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
      LEARNING_LOOPS_ENABLED: ${LEARNING_LOOPS_ENABLED:-true}
      ADAPTIVE_SELECTION_ENABLED: ${ADAPTIVE_SELECTION_ENABLED:-false}
      METRICS_ENABLED: "true"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./client
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  mongo-data:
  redis-data:
