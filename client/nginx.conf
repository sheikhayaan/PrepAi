# SPA host + same-origin API reverse proxy.
# Keeping /api same-origin means the auth cookie stays first-party and no CORS
# preflight is needed in the containerised deployment.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SSE: buffering must be off or tokens arrive in bursts.
    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://api:5000/health;
        proxy_set_header Host $host;
    }

    location = /health/ready {
        proxy_pass http://api:5000/health/ready;
        proxy_set_header Host $host;
    }

    location = /metrics {
        proxy_pass http://api:5000/metrics;
        proxy_set_header Host $host;
    }

    # Client-side routes (/dashboard, /interview/:id, ...) all serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
